<main class="container mt-3 mt-md-4 mb-4 mb-md-5 flex-grow-1">
    <div class="card app-card workbench">
        <div class="card-body p-3 p-md-4">
            <div class="form-section form-section--first">
                <div class="field-heading">
                    <label for="inputConfig" class="form-label mb-0">Configs</label>
                    <span id="baseConfigCount" class="field-meta" aria-live="polite">0 configs</span>
                </div>
                <textarea id="inputConfig" class="form-control font-monospace code-input" rows="5" placeholder="vless://..." spellcheck="false"></textarea>
            </div>

            <div class="form-section">
                <label class="form-label">Input Type</label>
                <input type="hidden" id="inputType" value="list">
                <div class="input-type-selector" role="group" aria-label="Input type">
                    <div>
                        <input type="radio" class="btn-check" name="inputTypeOption" id="typeList" value="list" checked onchange="document.getElementById('inputType').value = this.value; toggleInputFields();">
                        <label class="btn btn-outline-secondary w-100" for="typeList">IP List</label>
                    </div>
                    <div>
                        <input type="radio" class="btn-check" name="inputTypeOption" id="typeCidr" value="cidr" onchange="document.getElementById('inputType').value = this.value; toggleInputFields();">
                        <label class="btn btn-outline-secondary w-100" for="typeCidr">IP Ranges</label>
                    </div>
                    <div>
                        <input type="radio" class="btn-check" name="inputTypeOption" id="typeConfigList" value="configList" onchange="document.getElementById('inputType').value = this.value; toggleInputFields();">
                        <label class="btn btn-outline-secondary w-100" for="typeConfigList">Configs List</label>
                    </div>
                    <div>
                        <input type="radio" class="btn-check" name="inputTypeOption" id="typeSniSpoof" value="sniSpoof" onchange="document.getElementById('inputType').value = this.value; toggleInputFields();">
                        <label class="btn btn-outline-secondary w-100" for="typeSniSpoof">SNI Spoof</label>
                    </div>
                    <div>
                        <input type="radio" class="btn-check" name="inputTypeOption" id="typePattng" value="pattng" onchange="document.getElementById('inputType').value = this.value; toggleInputFields();">
                        <label class="btn btn-outline-secondary w-100" for="typePattng">PattNG</label>
                    </div>
                </div>

                <div id="listFields" class="method-panel mb-0">
                    <label for="ipList" class="form-label">IP List</label>
                    <textarea id="ipList" class="form-control font-monospace code-input" rows="8" placeholder="1.1.1.1" spellcheck="false"></textarea>
                </div>

                <div id="pattngFields" class="method-panel mb-0" style="display: none;">
                    <label for="pattngIpList" class="form-label">IP List</label>
                    <textarea id="pattngIpList" class="form-control font-monospace code-input" rows="8" placeholder="104.21.70.21" spellcheck="false">104.21.70.21</textarea>
                </div>

                <div id="cidrFields" class="method-panel mb-0" style="display: none;">
                    <div class="field-heading field-heading--providers">
                        <label for="ipRange" class="form-label mb-0">IP Ranges</label>
                        <div class="provider-presets d-flex flex-wrap gap-2">
                            <button type="button" onclick="loadIPRanges('cloudflare')" class="btn provider-button">
                                <span class="provider-dot provider-dot-cloudflare" aria-hidden="true"></span>Cloudflare
                            </button>
                            <button type="button" onclick="loadIPRanges('gcore')" class="btn provider-button">
                                <span class="provider-dot provider-dot-gcore" aria-hidden="true"></span>Gcore
                            </button>
                            <button type="button" onclick="loadIPRanges('fastly')" class="btn provider-button">
                                <span class="provider-dot provider-dot-fastly" aria-hidden="true"></span>Fastly
                            </button>
                        </div>
                    </div>
                    <textarea id="ipRange" class="form-control font-monospace code-input" rows="5" placeholder="104.16.0.0/13" spellcheck="false"></textarea>

                    <div class="output-count-control">
                        <label for="outputCount" class="form-label">Number of Outputs</label>
                        <input type="number" id="outputCount" class="form-control output-count-input" step="1" value="2048" inputmode="numeric">
                    </div>
                </div>

                <div class="method-panel mb-0" id="configListFields" style="display: none;">
                    <label for="configList" class="form-label">Configs List</label>
                    <textarea id="configList" class="form-control font-monospace code-input" rows="8" placeholder="vless://..." spellcheck="false"></textarea>
                </div>

                <div class="method-panel mb-0" id="sniSpoofFields" style="display: none;">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label for="spoofIp" class="form-label">Spoof IP</label>
                            <input type="text" id="spoofIp" class="form-control code-input" value="127.0.0.1" placeholder="127.0.0.1" spellcheck="false">
                        </div>
                        <div class="col-md-5">
                            <label for="spoofPort" class="form-label">Spoof Port</label>
                            <input type="number" id="spoofPort" class="form-control" value="40443" placeholder="40443">
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert form-message" role="alert" id="messageBox" style="display: none;">
                <span id="messageText"></span>
            </div>

            <div class="form-actions" id="formActions">
                <button type="button" onclick="generateConfigs()" class="btn btn-primary generate-button">Generate</button>
                <button type="button" onclick="copyToClipboard()" class="btn btn-outline-secondary" id="copyButton" style="display: none;">Copy</button>
                <button type="button" onclick="downloadOutput()" class="btn btn-outline-secondary" id="downloadButton" style="display: none;">Download</button>
            </div>
        </div>
    </div>
</main>

<script src="assets/js/ipaddr.min.js?v=2.0.1"></script>
